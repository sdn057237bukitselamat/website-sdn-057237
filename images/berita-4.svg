    <rect x="25" y="25" width="130" height="90" rx="6" fill="#1e1b4b" stroke="#c7d2fe" stroke-width="3"/>
    <rect x="35" y="35" width="110" height="70" fill="#0284c7" rx="3"/>
    <!-- Checkmark on screen -->
