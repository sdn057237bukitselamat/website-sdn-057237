  <rect x="0" y="240" width="500" height="80" fill="#312e81" opacity="0.9"/>
  <text x="250" y="272" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle">Sukses Pelaksanaan Gladi Bersih ANBK 2026</text>
  <text x="250" y="298" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c7d2fe" text-anchor="middle">Siswa Kelas 5 SDN 057237 Antusias Menjalani Asesmen Literasi &amp; Numerasi</text>
