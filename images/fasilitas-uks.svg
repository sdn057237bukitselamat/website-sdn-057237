<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgU" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="12" fill="url(#bgU)"/>
  <polygon points="0,260 400,260 400,200 0,200" fill="#e2e8f0"/>
  <!-- UKS / Red Cross Emblem on Wall -->
  <circle cx="200" cy="70" r="32" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <rect x="193" y="48" width="14" height="44" fill="#ef4444"/>
  <rect x="178" y="63" width="44" height="14" fill="#ef4444"/>
  <text x="200" y="125" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#0369a1" text-anchor="middle">Ruang UKS (Usaha Kesehatan Sekolah)</text>
  <!-- Clinic Bed -->
  <rect x="40" y="170" width="150" height="45" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <!-- Mattress & Pillow -->
  <rect x="42" y="165" width="146" height="15" rx="3" fill="#38bdf8"/>
  <ellipse cx="65" cy="172" rx="14" ry="6" fill="#ffffff"/>
  <!-- Bed Legs -->
  <line x1="48" y1="215" x2="48" y2="240" stroke="#64748b" stroke-width="4"/>
  <line x1="182" y1="215" x2="182" y2="240" stroke="#64748b" stroke-width="4"/>
  <!-- Medicine Cabinet -->
  <rect x="260" y="130" width="90" height="100" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="270" y="140" width="70" height="35" rx="2" fill="#e0f2fe"/>
  <rect x="270" y="185" width="70" height="35" rx="2" fill="#e0f2fe"/>
  <circle cx="290" cy="155" r="5" fill="#ef4444"/>
  <circle cx="310" cy="155" r="5" fill="#0284c7"/>
</svg>
