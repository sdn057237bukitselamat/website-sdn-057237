<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#g4Grad)"/>
  <rect x="0" y="270" width="600" height="130" fill="#f8fafc"/>
  <!-- Classroom presentation board -->
  <rect x="120" y="50" width="360" height="180" rx="8" fill="#ffffff" stroke="#38bdf8" stroke-width="4"/>
  <!-- Chart graphic inside board -->
  <line x1="160" y1="180" x2="440" y2="180" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="160" y1="80" x2="160" y2="180" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="190" y="130" width="35" height="50" rx="3" fill="#3b82f6"/>
  <rect x="250" y="100" width="35" height="80" rx="3" fill="#10b981"/>
  <rect x="310" y="120" width="35" height="60" rx="3" fill="#f59e0b"/>
  <rect x="370" y="90" width="35" height="90" rx="3" fill="#ec4899"/>
  <!-- Teacher pointer -->
  <line x1="490" y1="160" x2="390" y2="110" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
  <!-- Desk in foreground -->
  <rect x="100" y="280" width="400" height="60" rx="4" fill="#d97706"/>
  <rect x="0" y="340" width="600" height="60" fill="#0f172a" opacity="0.85"/>
  <text x="300" y="375" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Pembelajaran Tematik &amp; Interaktif Berbasis Proyek</text>
</svg>
