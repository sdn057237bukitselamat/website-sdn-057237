<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgK" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="12" fill="url(#bgK)"/>
  <!-- Floor -->
  <polygon points="0,260 400,260 400,190 0,190" fill="#cbd5e1"/>
  <line x1="100" y1="190" x2="60" y2="260" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="200" y1="190" x2="180" y2="260" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="300" y1="190" x2="310" y2="260" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Whiteboard -->
  <rect x="70" y="30" width="260" height="120" rx="6" fill="#ffffff" stroke="#047857" stroke-width="4"/>
  <line x1="80" y1="140" x2="320" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Text on Board -->
  <text x="200" y="70" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">Ruang Kelas Nyaman &amp; Bersih</text>
  <text x="200" y="95" font-family="'Segoe UI', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Kurikulum Merdeka • SDN 057237 Bukit Selamat</text>
  <!-- Eraser & Marker Tray -->
  <rect x="160" y="145" width="80" height="6" rx="2" fill="#94a3b8"/>
  <rect x="180" y="142" width="25" height="4" fill="#ef4444"/>
  <rect x="215" y="142" width="15" height="4" fill="#3b82f6"/>
  <!-- Teacher's Desk & Chair -->
  <rect x="30" y="150" width="55" height="45" rx="3" fill="#b45309"/>
  <polygon points="25,150 90,150 95,158 20,158" fill="#d97706"/>
  <!-- Student Desk & Chair -->
  <rect x="140" y="170" width="120" height="50" rx="3" fill="#b45309"/>
  <polygon points="130,170 270,170 280,180 120,180" fill="#d97706"/>
  <!-- Book on desk -->
  <polygon points="175,172 205,172 210,178 170,178" fill="#38bdf8"/>
  <!-- Globe / Clock -->
  <circle cx="360" cy="50" r="18" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="360" y1="50" x2="360" y2="40" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="360" y1="50" x2="368" y2="50" stroke="#ef4444" stroke-width="1.5"/>
</svg>
