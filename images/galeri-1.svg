<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#g1Grad)"/>
  <!-- Field & Flagpole -->
  <rect x="0" y="300" width="600" height="100" fill="#15803d"/>
  <rect x="0" y="320" width="600" height="80" fill="#166534"/>
  <!-- Flagpole -->
  <line x1="300" y1="320" x2="300" y2="40" stroke="#cbd5e1" stroke-width="5"/>
  <polygon points="300,40 370,60 300,80" fill="#dc2626"/>
  <polygon points="300,60 370,60 300,80" fill="#ffffff"/>
  <!-- Students in line saluting -->
  <g transform="translate(180, 270)">
    <circle cx="10" cy="5" r="7" fill="#fed7aa"/>
    <rect x="5" y="12" width="10" height="16" fill="#ffffff"/>
    <rect x="5" y="28" width="10" height="18" fill="#dc2626"/>
    <!-- Arm saluting -->
    <line x1="14" y1="14" x2="20" y2="5" stroke="#fed7aa" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(220, 270)">
    <circle cx="10" cy="5" r="7" fill="#fed7aa"/>
    <rect x="5" y="12" width="10" height="16" fill="#ffffff"/>
    <rect x="5" y="28" width="10" height="18" fill="#dc2626"/>
    <line x1="14" y1="14" x2="20" y2="5" stroke="#fed7aa" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(370, 270)">
    <circle cx="10" cy="5" r="7" fill="#fed7aa"/>
    <rect x="5" y="12" width="10" height="16" fill="#ffffff"/>
    <rect x="5" y="28" width="10" height="18" fill="#dc2626"/>
    <line x1="14" y1="14" x2="20" y2="5" stroke="#fed7aa" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(410, 270)">
    <circle cx="10" cy="5" r="7" fill="#fed7aa"/>
    <rect x="5" y="12" width="10" height="16" fill="#ffffff"/>
    <rect x="5" y="28" width="10" height="18" fill="#dc2626"/>
    <line x1="14" y1="14" x2="20" y2="5" stroke="#fed7aa" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Overlay Title -->
  <rect x="0" y="340" width="600" height="60" fill="#0f172a" opacity="0.85"/>
  <text x="300" y="375" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Upacara Bendera Hari Senin Penuh Khidmat</text>
</svg>
