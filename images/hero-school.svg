<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="500" rx="16" fill="url(#skyGrad)"/>

  <!-- Sun & Clouds -->
  <circle cx="680" cy="110" r="50" fill="#fef08a" opacity="0.8"/>
  <circle cx="680" cy="110" r="40" fill="#fde047"/>
  
  <!-- Cloud 1 -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="180" cy="90" rx="45" ry="22"/>
    <ellipse cx="215" cy="80" rx="35" ry="26"/>
    <ellipse cx="150" cy="95" rx="30" ry="18"/>
  </g>
  <!-- Cloud 2 -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="500" cy="120" rx="40" ry="18"/>
    <ellipse cx="530" cy="110" rx="30" ry="22"/>
  </g>

  <!-- Rolling Hills (Bukit Selamat) -->
  <path d="M-50 360 Q 200 240 450 330 T 850 310 L 850 500 L -50 500 Z" fill="url(#hillGrad1)" opacity="0.6"/>
  <path d="M-50 400 Q 180 310 420 370 T 850 360 L 850 500 L -50 500 Z" fill="url(#hillGrad2)" opacity="0.8"/>

  <!-- School Yard / Courtyard -->
  <rect x="0" y="420" width="800" height="80" fill="#e2e8f0"/>
  <rect x="0" y="445" width="800" height="55" fill="#cbd5e1"/>

  <!-- School Building Main Block -->
  <g filter="url(#shadow)">
    <!-- Base Walls -->
    <rect x="180" y="240" width="440" height="180" fill="url(#wallGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Central Elevated Hallway -->
    <rect x="330" y="210" width="140" height="210" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Main Roof (Left & Right) -->
    <polygon points="160,240 400,160 400,240" fill="url(#roofGrad)"/>
    <polygon points="400,160 640,240 400,240" fill="#991b1b"/>
    <!-- Center Pediment Roof -->
    <polygon points="320,210 400,140 480,210" fill="url(#roofGrad)" stroke="#7f1d1d" stroke-width="1.5"/>

    <!-- School Sign Board on Center -->
    <rect x="345" y="225" width="110" height="28" rx="4" fill="#1e3a8a"/>
    <text x="400" y="243" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SDN 057237</text>

    <!-- Indonesian Flag Pole & Flag -->
    <line x1="400" y1="140" x2="400" y2="70" stroke="#94a3b8" stroke-width="3"/>
    <polygon points="400,70 450,85 400,100" fill="#dc2626"/>
    <polygon points="400,85 450,85 400,100" fill="#ffffff"/>
    <circle cx="400" cy="70" r="4" fill="#f59e0b"/>

    <!-- Windows Left -->
    <rect x="210" y="270" width="40" height="55" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <rect x="270" y="270" width="40" height="55" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <!-- Windows Right -->
    <rect x="490" y="270" width="40" height="55" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <rect x="550" y="270" width="40" height="55" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>

    <!-- School Main Entrance Door -->
    <rect x="370" y="340" width="60" height="80" rx="3" fill="#1e293b"/>
    <rect x="375" y="345" width="22" height="70" rx="2" fill="#0284c7" opacity="0.6"/>
    <rect x="403" y="345" width="22" height="70" rx="2" fill="#0284c7" opacity="0.6"/>

    <!-- Entrance Pillars & Steps -->
    <rect x="350" y="270" width="12" height="150" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="438" y="270" width="12" height="150" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="340" y="415" width="120" height="8" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Trees & Garden -->
  <!-- Left Tree -->
  <rect x="110" y="340" width="16" height="80" fill="#78350f" rx="3"/>
  <circle cx="118" cy="320" r="45" fill="#16a34a"/>
  <circle cx="100" cy="300" r="35" fill="#22c55e"/>
  <circle cx="135" cy="305" r="35" fill="#15803d"/>

  <!-- Right Tree -->
  <rect x="670" y="350" width="16" height="70" fill="#78350f" rx="3"/>
  <circle cx="678" cy="330" r="42" fill="#15803d"/>
  <circle cx="660" cy="315" r="32" fill="#22c55e"/>
  <circle cx="695" cy="315" r="32" fill="#16a34a"/>

  <!-- Students Walking Character Silhouette / Illustration -->
  <!-- Student 1 (Boy) -->
  <g transform="translate(260, 390)">
    <circle cx="15" cy="10" r="10" fill="#fbcfe8"/> <!-- head -->
    <rect x="8" y="20" width="14" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/> <!-- white shirt -->
    <rect x="9" y="42" width="12" height="18" fill="#dc2626"/> <!-- red shorts -->
    <line x1="11" y1="60" x2="11" y2="75" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>
    <line x1="19" y1="60" x2="19" y2="75" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>
    <!-- Backpack -->
    <rect x="3" y="22" width="6" height="16" rx="2" fill="#2563eb"/>
  </g>

  <!-- Student 2 (Girl with hijab / uniform) -->
  <g transform="translate(300, 390)">
    <circle cx="15" cy="10" r="11" fill="#ffffff" stroke="#e2e8f0"/> <!-- white hijab -->
    <circle cx="15" cy="11" r="7" fill="#fbcfe8"/> <!-- face -->
    <path d="M 5 22 L 25 22 L 28 45 L 2 45 Z" fill="#ffffff" stroke="#cbd5e1"/> <!-- white blouse -->
    <path d="M 2 45 L 28 45 L 32 75 L -2 75 Z" fill="#dc2626"/> <!-- red long skirt -->
    <!-- Backpack -->
    <rect x="23" y="23" width="6" height="16" rx="2" fill="#10b981"/>
  </g>
</svg>
