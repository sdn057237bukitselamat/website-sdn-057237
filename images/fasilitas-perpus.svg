  <rect x="83" y="52" width="15" height="38" rx="2" fill="#10b981"/>
  <rect x="101" y="58" width="14" height="32" rx="2" fill="#f59e0b"/>
  <rect x="118" y="54" width="12" height="36" rx="2" fill="#8b5cf6"/>
  <rect x="133" y="62" width="16" height="28" rx="2" fill="#ec4899"/>
  <!-- Row 2 -->
  <rect x="55" y="105" width="14" height="35" rx="2" fill="#3b82f6"/>
