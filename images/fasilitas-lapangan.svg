<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="skyL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="260" rx="12" fill="url(#skyL)"/>
  <!-- Field Surface -->
  <polygon points="0,110 400,110 400,260 0,260" fill="url(#fieldGrad)"/>
  <!-- Court Markings (Perspective) -->
  <polygon points="60,130 340,130 380,240 20,240" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="200" y1="130" x2="200" y2="240" stroke="#ffffff" stroke-width="3"/>
  <ellipse cx="200" cy="185" rx="40" ry="20" fill="none" stroke="#ffffff" stroke-width="3"/>
  <!-- Goalpost Left -->
  <rect x="180" y="100" width="40" height="30" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="180" y1="100" x2="180" y2="130" stroke="#ffffff" stroke-width="2"/>
  <line x1="220" y1="100" x2="220" y2="130" stroke="#ffffff" stroke-width="2"/>
  <!-- Soccer Ball -->
  <circle cx="200" cy="185" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <polygon points="200,177 207,182 204,190 196,190 193,182" fill="#1e293b"/>
  <!-- Title Badge -->
  <rect x="80" y="20" width="240" height="40" rx="20" fill="#ffffff" opacity="0.9"/>
  <text x="200" y="45" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#15803d" text-anchor="middle">Lapangan Olahraga &amp; Upacara</text>
</svg>
