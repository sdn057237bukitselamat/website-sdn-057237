  <ellipse cx="255" cy="180" rx="6" ry="4" fill="#64748b"/>
  <!-- Computer 3 (Right) -->
  <rect x="270" y="80" width="80" height="60" rx="4" fill="#1e293b"/>
  <rect x="275" y="85" width="70" height="48" rx="2" fill="#f59e0b"/>
  <rect x="303" y="140" width="14" height="22" fill="#64748b"/>
  <rect x="293" y="158" width="34" height="4" rx="2" fill="#475569"/>
  <!-- Keyboard 3 -->
  <polygon points="272,175 348,175 352,185 268,185" fill="#94a3b8"/>
  <!-- Title Badge -->
  <text x="200" y="45" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Laboratorium Komputer &amp; TIK</text>
  <text x="200" y="65" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569" text-anchor="middle">Fasilitas Pembelajaran Digital &amp; ANBK</text>
